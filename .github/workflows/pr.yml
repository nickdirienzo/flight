name: PR

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build app
        run: swift build --target Flight

      - name: Build benchmarks
        run: swift build --target FlightBench

      - name: Run tests
        run: ./test.sh

      - name: Run benchmarks
        continue-on-error: true
        run: swift run -c release FlightBench
